# 정적 사이트라 빌드 과정이 없습니다. public 폴더를 그대로 올립니다.
[build]
  publish = "public"
  command = "echo 'static site - no build step'"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options        = "SAMEORIGIN"
    Referrer-Policy        = "no-referrer"

# 번들 파일 이름에 내용 지문이 붙어 있어(firebase.<해시>.js) 내용이 바뀌면 주소도 바뀝니다.
# 그래서 오래 캐시해도 안전합니다.
[[headers]]
  for = "/vendor/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# index.html 은 절대 캐시하지 않습니다. 항상 최신 번들 주소를 가리켜야 하기 때문입니다.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
